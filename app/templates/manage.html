<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>check — Управление привычками</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/manage.css') }}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=check,delete" />
</head>
<body>
    <div class="cont">
        <h1>Управление привычками</h1>
        <div class="habits">
            {% for habit_form in habits %}
                <form action="{{ url_for('main.manage') }}" method="post" class="habit-form" id="habit-form-{{ habit_form.id.data }}">
                    {{ habit_form.hidden_tag() }}
                    {{ habit_form.id(class='id') }}
                    {{ habit_form.name(class='name') }}
                    <div class="hidden-block">
                        <div class="actions">
                            {{ habit_form.delete(class="delete-button") }}
                            {{ habit_form.submit(class="submit-button") }}
                        </div>
                    </div>
                </form>
            {% endfor %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/manage.js') }}"></script>
</body>
</html>
